name: Publish Android APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          sdkmanager --licenses < <(yes)
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and validate release APK
        run: ./gradlew test lintDebug assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk sleep-inducer-release.apk

      - name: Verify release signature and package
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --verbose "$apk"
          signer_sha256="$("$apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$signer_sha256" = "f983cd5963b821bff295cb349cc43ef074f3ee76aa467900722f06eabdef5566"
          application_id="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")"
          test "$application_id" = "com.sleepinducer.app"
          version_name="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$apk")"
          test "$version_name" = "${RELEASE_TAG#v}"

      - name: Install and launch release APK
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r app/build/outputs/apk/release/app-release.apk
            launch_result="$(adb shell am start -W -n com.sleepinducer.app/.MainActivity)"
            printf '%s\n' "$launch_result"
            printf '%s\n' "$launch_result" | grep -Fx 'Status: ok'
            for attempt in 1 2 3 4 5; do
              process_id="$(adb shell pidof com.sleepinducer.app | tr -d '\r' || true)"
              if test -n "$process_id"; then
                printf 'Running app process: %s\n' "$process_id"
                exit 0
              fi
              sleep 2
            done
            adb logcat -d -t 200 -s AndroidRuntime:E ActivityManager:E
            exit 1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" sleep-inducer-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -Fxq "sleep-inducer-release-unsigned.apk"; then
              gh release delete-asset "$RELEASE_TAG" sleep-inducer-release-unsigned.apk \
                --repo "$GITHUB_REPOSITORY" --yes
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sleep Inducer $RELEASE_TAG" \
              --notes "Signed Android APK. The release build was signature-verified and installed and launched on an API 35 emulator."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Sleep Inducer $RELEASE_TAG" \
              --generate-notes \
              --notes "Signed Android APK. The release build was signature-verified and installed and launched on an API 35 emulator." \
              sleep-inducer-release.apk
          fi
